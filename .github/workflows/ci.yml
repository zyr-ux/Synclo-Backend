name: Continuous Integration

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run test suite with pytest
        env:
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_minimum_32_characters_for_ci_run_1234
          REFRESH_TOKEN_HASH_KEY: test_refresh_token_hash_key_for_ci_12345
          ENVIRONMENT: development
          ALLOW_ARBITRARY_PUSH_ENDPOINTS: "true"
          ALLOW_LOCAL_PUSH_ENDPOINTS: "true"
        run: |
          pytest -v
