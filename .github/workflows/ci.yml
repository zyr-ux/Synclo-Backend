name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-schema:
    name: Lint & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Type Checker
        run: uv run ty check .

      - name: Verify Alembic migrations and schema parity
        env:
          DATABASE_URL: sqlite:///./ci_temp.db
          SECRET_KEY: test_secret_key_minimum_32_characters_for_ci_run_1234
          REFRESH_TOKEN_HASH_KEY: test_refresh_token_hash_key_for_ci_12345
        run: |
          uv run alembic upgrade head
          uv run alembic check

  test:
    name: Pytest Suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2.5-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run test suite with pytest & coverage
        env:
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_minimum_32_characters_for_ci_run_1234
          REFRESH_TOKEN_HASH_KEY: test_refresh_token_hash_key_for_ci_12345
          ENVIRONMENT: development
          ALLOW_ARBITRARY_PUSH_ENDPOINTS: "true"
          ALLOW_LOCAL_PUSH_ENDPOINTS: "true"
        run: |
          uv run pytest -v --cov=app --cov-report=term-missing

  docker:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t synclo-backend:ci .
