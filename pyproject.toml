[project]
name = "synclo-backend"
version = "1.0.0"
description = "Zero-Knowledge, real-time clipboard synchronization backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [{ name = "zyr-ux" }]

keywords = [
    "clipboard",
    "synchronization",
    "fastapi",
    "zero-knowledge",
    "e2ee",
    "websockets",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
]


dependencies = [
    "alembic==1.18.4",
    "bcrypt==4.0.1",
    "cryptography==45.0.5",
    "email-validator==2.3.0",
    "fastapi==0.136.3",
    "fastapi-limiter==0.1.6",
    "httpx==0.28.1",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "pycryptodome==3.23.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "redis==5.0.8",
    "SQLAlchemy==2.0.50",
    "uvicorn==0.48.0",
    "uvloop==0.22.1; platform_system != 'Windows'",
    "watchfiles==1.2.0",
    "websockets==15.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx==0.28.1",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "alembic", "data", "logs"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "W", # pycodestyle warnings
]
ignore = [
    "E501", # line too long (handled gracefully, don't break CI for occasional long strings/comments)
]


[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project.urls]
Homepage = "https://github.com/zyr-ux/Synclo-Backend"
Repository = "https://github.com/zyr-ux/Synclo-Backend.git"
Issues = "https://github.com/zyr-ux/Synclo-Backend/issues"
