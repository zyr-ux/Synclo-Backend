[project]
name = "synclo-backend"
version = "1.0.0"
description = "Zero-Knowledge, real-time clipboard synchronization backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
authors = [{ name = "zyr-ux" }]

dependencies = [
    "alembic>=1.20.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    # fastapi-limiter 0.2.0 is a breaking rewrite which needs a massive refactor of all the endpoints
    "fastapi-limiter>=0.1.6,<0.2.0",
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic>=2.13.5",
    "PyJWT>=2.14.0",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "SQLAlchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "uvloop>=0.22.1; platform_system != 'Windows'",
    "watchfiles>=1.2.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "httpx>=0.28.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".git", ".venv", "alembic", "data", "logs"]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "F", # Pyflakes
    "W", # pycodestyle warnings
]
ignore = [
    "E501", # line too long
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.urls]
Homepage = "https://github.com/zyr-ux/Synclo-Backend"
Repository = "https://github.com/zyr-ux/Synclo-Backend.git"
Issues = "https://github.com/zyr-ux/Synclo-Backend/issues"
